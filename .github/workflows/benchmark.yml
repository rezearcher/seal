name: Benchmarks

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev

      - name: Run VPE verify benchmark
        run: |
          uv run python benchmark_vpe_verify.py 2>&1 | tee benchmark_vpe_verify.log

      - name: Run envelope size benchmark
        run: |
          uv run python benchmark_envelope_size.py 2>&1 | tee benchmark_envelope_size.log

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_*.log
          if-no-files-found: ignore
